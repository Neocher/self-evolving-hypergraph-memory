[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shm"
version = "4.2.0"
description = "Self-evolving Hypergraph Memory v4.0 — Stability Release"
requires-python = ">=3.10"
dependencies = [
    "kuzu>=0.7.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "structlog>=23.0.0",
    "prometheus-client>=0.17.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "scikit-learn>=1.3.0",
    "blake3>=1.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shm*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: Long-running benchmark tests",
    "slow: Slow tests that take more than 1 second",
]
