[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shm"
version = "6.28.0"
description = "SHM — 自演化超图记忆系统 (Self-evolving Hypergraph Memory)"
readme = "README.md"
license = {text = "MIT"}
keywords = ["memory", "knowledge-graph", "llm", "rag", "hypergraph", "vector-search"]
authors = [
    {name = "Neocher"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

requires-python = ">=3.11"
dependencies = [
    # ⚠️ 存储引擎 GraphLite SDK (graphlite_sdk, Apache-2.0) — 【仅迁移需要】：
    #   v6.0.0 起默认后端为 OverGraph；graphlite_sdk 不在 PyPI，仅
    #   scripts/migrate_graphlite_to_overgraph.py 读旧库时需要，迁移完成可移除。
    #   详见 requirements.txt 注释。
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "structlog>=23.0.0",
    "prometheus-client>=0.17.0",
    "fastapi>=0.104.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "scikit-learn>=1.3.0",
    "cdlib>=0.4.1",
    "leidenalg>=0.10.0",
    "blake3>=1.0.0",
    "pyyaml>=6.0",
    "overgraph>=0.17.0",  # 存储引擎（纯 Rust 嵌入式图数据库，v6.0.0 起唯一后端）
]

[project.optional-dependencies]
# 测试/开发期依赖。CI 用 `pip install -e ".[test,onnx]"` 安装。
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "rdflib>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# ONNX 快路径（EmbeddedLLM/bge-m3-onnx-o2-cpu）。可选：缺失时 encoder 自动回退
# sentence-transformers，仅慢一些，不影响正确性。
# 注意：这里只声明 onnxruntime。`optimum` 暂不声明 —— 实测 optimum-onnx 2.1.0
# 要求 transformers<4.58，会把运行栈从 transformers 5.x / sentence-transformers
# 6.x 强制降级（2026-11-20 安装验证），属于需要单独决策的依赖冲突。
onnx = [
    "onnxruntime>=1.18",
]

[project.urls]
Homepage = "https://github.com/Neocher/self-evolving-hypergraph-memory"
Repository = "https://github.com/Neocher/self-evolving-hypergraph-memory"
Documentation = "https://github.com/Neocher/self-evolving-hypergraph-memory#readme"

[project.scripts]
shm-server = "run_server:main"

[tool.setuptools]
# run_server.py 是根目录单模块（启动入口），不在 packages.find 的包里。
py-modules = ["run_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shm*", "api*", "core*", "graph*", "embedding*", "retrieval*", "config*", "observability*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not graphlite'"
markers = [
    "benchmark: Long-running benchmark tests",
    "slow: Slow tests that take more than 1 second",
    "integration: Tests requiring live DEEPSEEK_API_KEY",
    "overgraph: v6.0.0 OverGraph backend integration tests",
    "graphlite: v6.0.0 GraphLite legacy backend tests (excluded by default)",
]
