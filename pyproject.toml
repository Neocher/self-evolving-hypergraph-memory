[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shm"
version = "5.21.5"
description = "SHM — 自演化超图记忆系统 (Self-evolving Hypergraph Memory)"
readme = "README.md"
license = {text = "MIT"}
keywords = ["memory", "knowledge-graph", "llm", "rag", "hypergraph", "vector-search"]
authors = [
    {name = "Neocher"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

requires-python = ">=3.10"
dependencies = [
    # ⚠️ 存储引擎 GraphLite SDK (graphlite_sdk, Apache-2.0) 不在 PyPI:
    #   git clone https://github.com/GraphLite-AI/GraphLite ~/GraphLite
    #   cd ~/GraphLite && cargo build --release -p graphlite-ffi
    #   export GRAPHLITE_BINDINGS=~/GraphLite/bindings/python
    #   export GRAPHLITE_SDK=~/GraphLite/sdk-python/src
    #   详见 README「Installation」章节。
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "structlog>=23.0.0",
    "prometheus-client>=0.17.0",
    "fastapi>=0.104.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "scikit-learn>=1.3.0",
    "cdlib>=0.4.1",
    "leidenalg>=0.10.0",
    "blake3>=1.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Neocher/self-evolving-hypergraph-memory"
Repository = "https://github.com/Neocher/self-evolving-hypergraph-memory"
Documentation = "https://github.com/Neocher/self-evolving-hypergraph-memory#readme"

[project.scripts]
shm-server = "run_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shm*", "api*", "core*", "graph*", "embedding*", "retrieval*", "config*", "observability*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: Long-running benchmark tests",
    "slow: Slow tests that take more than 1 second",
    "integration: Tests requiring live DEEPSEEK_API_KEY",
]
