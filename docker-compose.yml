version: "3.9"

services:
  shm:
    build: .
    container_name: shm
    ports:
      - "8000:8000"
    volumes:
      - shm_data:/app/data
    environment:
      - SHM_BASE_URL=http://127.0.0.1:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  shm_data:
