name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 | tail -30

      - name: Check version consistency
        run: |
          python3 -c "
          import sys, tomllib
          sys.path.insert(0, '.')
          from shm._version import __version__
          with open('pyproject.toml', 'rb') as f:
              pyproject_version = tomllib.load(f)['project']['version']
          with open('VERSION') as f:
              version_file = f.read().strip()
          assert __version__ == pyproject_version, \
              f'mismatch: _version.py={__version__} pyproject.toml={pyproject_version}'
          assert __version__ == version_file, \
              f'mismatch: _version.py={__version__} VERSION={version_file}'
          print(f'SHM version consistent: {__version__}')
          "

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
