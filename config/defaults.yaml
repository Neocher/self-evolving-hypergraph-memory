# SHM v3.0 默认配置
# 所有可调参数集中管理，运行时可通过环境变量 SHM_<section>__<key> 覆盖
# 示例: SHM_TAU__TAU_DECAY_SECONDS=3600 覆盖 tau.tau_decay_seconds

tau:
  tau_initial: 1.0              # 初始 τ 值 (0, 1]
  tau_decay_seconds: 1800        # 衰减时间常数（秒），30分钟
  decay_threshold: 0.1           # 修剪阈值 (0, 1)
  refresh_on_access: true        # 访问时是否刷新 τ

hebbian:
  k_sparsity: 8                  # 每节点保留的最强连接数 (DNC 经验值)
  learning_rate: 0.1             # 学习率 η
  decay_constant: 0.01           # 权重衰减常数
  activation_threshold: 0.3      # 激活度阈值
  max_connections_per_node: 64   # 单节点连接绝对上限

ssm:
  hidden_dim: 128                # 隐层维度
  input_dim: 8                   # 输入特征维度
  gate_threshold: 0.5            # 保留/遗忘阈值
  state_decay: 0.9               # 状态衰减系数
  seed: 42                       # 随机种子
  feat_mean_activation: 0        # 特征索引: 超边内节点平均激活度
  feat_age_hours: 1              # 特征索引: 超边年龄（小时）
  feat_access_freq: 2            # 特征索引: 访问频率
  feat_member_count: 3           # 特征索引: 成员节点数
  feat_community_density: 4      # 特征索引: 社区密度
  feat_tau_mean: 5               # 特征索引: 平均 τ 值
  feat_tau_variance: 6           # 特征索引: τ 方差
  feat_connection_entropy: 7     # 特征索引: 连接熵

dream:
  idle_timeout_seconds: 300      # 空闲触发等待时间（秒），5分钟
  accum_threshold: 200           # 累积新节点触发阈值（原20过激：批量写入时每分钟触发梦境+LLM调用抢资源）
  min_interval_seconds: 60       # 最小梦境间隔（秒）
  max_dream_duration_seconds: 450  # 单次梦境最长执行时间（秒）
  cpu_affinity_low_priority: true  # 低优先级 CPU 亲和性
  memory_limit_mb: 256           # 梦境线程内存限制（MB）

graphlite:
  database_path: "./data/shm_graphlite_db"  # GraphLite 数据库文件路径
  buffer_pool_size_mb: 1024      # 缓冲池大小（MB），适配 424MB 数据库
  max_threads: 4                 # 最大工作线程数

faiss:
  dimension: 512                 # 向量维度（bge-small-zh-v1.5, 512维中文专用, CPU 快 28 倍）
  index_type: "FlatL2"           # FAISS 索引类型（<10K向量用FlatL2最快）
  nlist: 100                     # IVF 聚类中心数（IVFFlat 专用）
  nprobe: 3                      # 搜索时探测的聚类数（降低=更快）

retrieval:
  top_k_l1: 5                    # L1 FAISS 检索 top-K (直接查 EpisodeNode)
  top_k_vector: 20               # L2 向量检索 top-K
  top_k_keyword: 20              # L3 关键词检索 top-K
  top_k_episodes: 20             # 中粒度：展开的情节数
  top_k_facts: 50                # 细粒度：最终返回的事实数
  score_threshold: 0.3           # 得分阈值过滤
  use_tau_rerank: true           # 是否使用 τ 值重排序
  tau_weight: 0.4                # τ 值权重（混合模式）
  vector_weight: 0.6             # 向量相似度权重（混合模式）
  community_expansion:           # v5.41.0 社区扩召回（补充非替代，关闭=现状）
    enabled: true                # 开关
    boost: 0.6                   # 扩展分 = relevance × min(种子分) × boost（相对尾分缩放）
    threshold: 0.5               # 社区相关度闸口（BM25-on-summary relevance < threshold 丢弃）
    max_members: 10              # 每社区最大成员召回数
  visual_recall:                 # v5.46.0 P2-a V-Mem 模态路由检索（补充非替代，关闭=现状）
    enabled: true                # 开关
    boost: 0.6                   # 视觉分 = 1/(1+dist) × min(种子分) × boost（相对尾分缩放，严格低于文本种子）
    max_results: 5               # 每查询最多追加的视觉结果数
    visual_limit: 10000          # prewarm 拉取 VisualNode 上限
  mesa:                          # v5.49.0 MESA 记忆增强检索（默认关）
    enabled: false               # 开关
    boost: 0.4                   # 合成分 = relevance × min(种子分) × boost（严格 < community boost 0.6）
    threshold: 0.5               # BM25-on-summary 相关度阈值（对齐 community_expansion）
    max_nodes: 5                 # 每查询最多合成节点数
  entity_expansion:              # v5.53.0 P3c 实体扩召回（跨消息多跳增强，补充非替代，关闭=现状）
    enabled: true                # 开关
    boost: 0.9                   # 扩展分 = max(种子分) × boost（仅低于最高种子）
    max_results: 10              # 每实体最大召回数
    max_entities: 3              # 每查询最多提取实体数
    time_filter: true            # 时间锚上界过滤（created_at <= session 时间锚）
  agentic_enabled: false         # P0-2 多步锚点检索编排开关（默认关，开启需 level=FUSION）
  rerank_enabled: true           # bge-reranker 重排开关（默认开，仅 FUSION 生效）
  rerank_input_k: 40             # 送入 reranker 的头部候选数（尾部保持原序 append）
  hyde_enabled: false            # P3b HyDE 假设文档增强开关（默认关，仅 FUSION 生效）
  hyde_mode: dual                # P3b HyDE 模式：dual（双路合并）/ replace（仅假设向量）
  hyde_timeout: 1.5              # P3b HyDE LLM 生成超时（秒），失败静默降级单路

embedding:
  model_name: "BAAI/bge-small-zh-v1.5"  # 中文 embedding 模型（512维，中文专用，CPU 0.05s/条）
  device: "auto"                # 推理设备: auto=自动检测(CUDA可用且显存充足→cuda,否则cpu) / cpu / cuda 强制

api:
  host: "127.0.0.1"             # 服务监听地址（生产环境使用 0.0.0.0）
  port: 8000                     # 服务监听端口
  log_level: "INFO"              # 日志级别 (DEBUG/INFO/WARNING/ERROR)
  cors_origins: ["*"]            # CORS 允许的源

circuit_breaker:
  failure_threshold: 0.5         # 错误率阈值（> 50% 跳闸）
  recovery_timeout: 30.0         # 半开等待时间（秒）
  half_open_max_requests: 1      # 半开探测请求数
  window_size: 10                # 滑动窗口大小（最近 N 次请求）

retry:
  max_attempts: 3                # 最大重试次数
  base_delay: 1.0                # 初始延迟（秒）
  backoff: 2.0                   # 退避乘数
  max_total_timeout: 0.0         # 全局超时（0=不限制）

community:
  template_threshold: 5          # ≤5 节点用模板，>5 用 LLM
  jaccard_threshold: 0.8         # 冲突检测 Jaccard 相似度阈值
  max_keywords: 10               # 模板报告最大关键词数

llm:
  endpoint: "http://127.0.0.1:11434/v1/chat/completions"  # LLM API 端点（Ollama 默认）
  model: "llama3"                # 默认模型名
  # ⚠️ 安全警告: 不要在此文件中填写 api_key。必须通过环境变量 DEEPSEEK_API_KEY / OPENAI_API_KEY 等设置。
  #    默认值为空字符串，表示"无需认证"。填写到 YAML 可能导致密钥被误提交到版本控制。
  api_key: ""                    # ❌ 请勿填写！使用环境变量
  timeout: 60.0                  # 超时秒数
  max_retries: 3                 # 最大重试次数
  fallback_endpoints: []         # 备用端点列表（按顺序尝试）

defense:
  enabled: true                    # 防御引擎开关
  silent: true                     # 静默模式（true=只隔离不阻断）
  max_writes_per_window: 20        # R1: 时间窗口内最大写入次数
  write_window_seconds: 60         # R1: 时间窗口（秒）
  drift_cosine_threshold: 0.65     # R2: 余弦相似度阈值
  drift_reference_window: 10       # R2: 参考历史窗口数
  max_entity_cooccurrence: 15      # R3: 单次写入最大实体数
  max_repeat_exact: 5              # R4: 去重窗口内最大精确重复数
  repeat_dedup_window: 300         # R4: 去重时间窗口（秒）
  trust_decay_per_block: 0.2       # R5: 每次阻断信任衰减量
  trust_recovery_writes: 20        # R5: 完全恢复需要的正常写入数
  initial_trust: 1.0               # R5: 新来源初始信任值
  block_trust_threshold: 0.3       # R5: 阻断信任阈值
  quarantine_trust_threshold: 0.5  # R5: 隔离信任阈值
  r6_enabled: true                 # R6: 内容级投毒模式检测开关（纯正则, severity映射固定不进YAML）

shm_client:
  base_url: "http://127.0.0.1:8000"  # SHM 服务地址（MCP/CLI/SDK 连接用）
  timeout: 15.0                     # 客户端超时
  mcp_http_port: 8222               # MCP HTTP 服务器端口

health:
  memory_warning_mb: 2048           # RSS 超过此值 → memory_status=warning
  memory_critical_mb: 3072          # RSS 超过此值 → memory_status=critical
